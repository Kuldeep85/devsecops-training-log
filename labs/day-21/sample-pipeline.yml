parameters:
  - name: enforce
    type: boolean
    default: false

trigger:
  branches:
    include:
      - main

variables:
  - name: nodeVersion
    value: 22

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build the app
    jobs:
      - job: BuildNode
        steps:
          - task: NodeTool@0
            displayName: Use Node $(nodeVersion)
            inputs:
              versionSpec: '$(nodeVersion).x'
          - script: |
              node --version
              npm --version
            displayName: Show versions
          - script: echo "enforce is ${{ parameters.enforce }}"
            displayName: Show enforce flag
      - job: SayHello
        steps:
          - script: echo hello
            displayName: Say hello
